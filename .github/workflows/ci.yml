name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Test, typecheck, lint and build
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ci-devtrack-secret-for-automated-tests
      DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build